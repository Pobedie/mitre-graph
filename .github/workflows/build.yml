name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash # so ./gradlew works on the Windows runner too

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            task: createDistributable # .deb/.rpm would need dpkg/rpmbuild
            artifact: app
          - os: macos-latest
            task: packageDmg
            artifact: dmg
          - os: windows-latest
            task: packageMsi
            artifact: msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # corretto 21 matches gradle/gradle-daemon-jvm.properties, so Gradle
      # reuses this JDK instead of downloading its own from foojay.
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew build ${{ matrix.task }}

      # Releases take files, not directories, so the Linux app dir gets tarred.
      # .dmg/.msi are already single files.
      - name: Stage asset
        run: |
          mkdir dist
          out=desktopApp/build/compose/binaries/main/${{ matrix.artifact }}
          if [ "${{ matrix.artifact }}" = app ]; then
            tar -C "$out" -czf dist/AttackGraph-linux-x64.tar.gz .
          else
            cp "$out"/* dist/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: AttackGraph-${{ matrix.os }}
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the release / upload assets
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # `create` fails if the release already exists (e.g. drafted in the UI),
      # so fall back to uploading into it.
      - run: |
          gh release create "$GITHUB_REF_NAME" dist/* --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # no checkout here, so gh needs this
